name: Выкладка на elementst.ru

# Сайт переехал с GitHub Pages на хостинг рег.ру. Публикация на Pages убрана
# вместе с прежним содержимым этого файла: два адреса у одного сайта путают
# и людей, и поиск.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      lighthouse:
        description: Прогнать Lighthouse по боевому адресу
        type: boolean
        default: false

# Токен нужен только на чтение исходников: заливка идёт по FTP своими
# секретами, ничего в репозиторий workflow не пишет.
permissions:
  contents: read

# Параллельные выкладки на один хостинг недопустимы: две встречные заливки с
# удалением лишнего съедят друг друга. В очереди держим последнюю.
concurrency:
  group: deploy
  cancel-in-progress: true

env:
  DOMAIN: elementst.ru

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Проверка типов
        run: npx tsc --noEmit

      - name: Сборка статики
        # Без NEXT_PUBLIC_BASE_PATH — сборка идёт под корень домена.
        run: npm run build

      - name: Проверка, что в выдаче нет подпапки
        run: node scripts/no-basepath.mjs

      - name: Установка lftp
        # lftp вместо готового экшена: mirror -R --delete делает ровно то, что
        # нужно (залить выдачу и вычистить то, чего в ней больше нет), и не
        # тащит в выкладку стороннего кода с доступом к секретам.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Учётные данные FTP
        # Пароль уходит в ~/.netrc, а не в командную строку: аргументы видны в
        # списке процессов, а спецсимволы в пароле ломают разбор -u user,pass.
        # Файл живёт только внутри задания и удаляется последним шагом.
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          umask 077
          printf 'machine %s\nlogin %s\npassword %s\n' \
            "$FTP_HOST" "$FTP_USER" "$FTP_PASSWORD" > "$HOME/.netrc"
          chmod 600 "$HOME/.netrc"
          # Настройки соединения — один раз на все вызовы lftp, а не копией в
          # каждом: разойдутся, и один из вызовов пойдёт открытым текстом.
          #
          # ssl-force ДА, verify-certificate НЕТ — и это осознанный размен, а
          # не небрежность. Сертификат FTPS на этом хостинге самоподписанный
          # («The certificate issuer is unknown»), проверить цепочку не по
          # чему. Отключать шифрование ради этого нельзя: пароль ушёл бы по
          # сети открытым текстом. ssl-force запрещает молчаливый откат в
          # открытый FTP, protect-data шифрует и канал данных. Остаётся, что
          # соединение зашифровано, но подлинность сервера не подтверждена.
          printf '%s\n' \
            'set ftp:ssl-force true' \
            'set ftp:ssl-protect-data true' \
            'set ssl:verify-certificate no' \
            'set net:max-retries 2' \
            'set net:timeout 15' \
            'set net:reconnect-interval-base 5' \
            'set net:reconnect-interval-max 15' \
            'set ftp:passive-mode true' \
            'set mirror:parallel-transfer-count 2' > "$HOME/.lftprc"
          chmod 600 "$HOME/.lftprc"

      - name: Разведка — где корень сайта
        # Путь не угадываем: ISPmanager кладёт домены по-разному, и промах с
        # последующим --delete стоил бы чужих файлов.
        #
        # ВСЁ ДЕЛАЕТСЯ ОДНОЙ СЕССИЕЙ, и это не красота, а необходимость.
        # Прежняя версия открывала отдельное соединение на каждого кандидата
        # и на каждый листинг — десяток подключений подряд, — и хостинг начал
        # их душить: шаг вставал намертво на пятнадцать минут. Теперь одно
        # соединение, внутри него все cd и ls.
        timeout-minutes: 5
        id: root
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
        run: |
          set -uo pipefail
          # cmd:fail-exit no — неудачный cd не обрывает сессию, а печатает
          # ошибку; по строкам «КАНДИДАТ N» и следующему за ними pwd видно,
          # какой путь существует.
          # ПЕРВЫМ ИДЁТ ТОТ, ЧТО ОКАЗАЛСЯ ВЕРНЫМ. Учётка FTP заперта в
          # каталоге data аккаунта, поэтому серверный абсолютный путь
          # /var/www/<пользователь>/data/www/<домен> по FTP недостижим — тот
          # же каталог виден как /www/<домен>. Остальные кандидаты оставлены
          # запасными: у другого хостинга дерево будет другим.
          SCRIPT="set cmd:fail-exit no; open \"$FTP_HOST\"; echo ТОЧКА-ВХОДА; pwd; cls -l;"
          N=0
          for DIR in \
            "/www/$DOMAIN" \
            "/data/www/$DOMAIN" \
            "/var/www/$FTP_USER/data/www/$DOMAIN" \
            "www/$DOMAIN" \
            "$DOMAIN" \
            "/$DOMAIN"
          do
            N=$((N + 1))
            SCRIPT="$SCRIPT cd /; echo КАНДИДАТ $N; cd \"$DIR\"; pwd;"
          done
          OUT=$(lftp -c "$SCRIPT" 2>&1)
          echo "$OUT" | sed 's/^/  /'

          # ПРОВАЛИВШИЙСЯ cd ТОЖЕ ПЕЧАТАЕТ строку ftp://, только с прежним
          # каталогом — значит отличать успех от неудачи по наличию строки
          # нельзя. Отличаем по тому, стоит ли в пути имя домена: хост и
          # пользователь в логе замаскированы звёздочками, а путь виден.
          MATCH=$(echo "$OUT" | awk -v dom="$DOMAIN" '
            $1 == "КАНДИДАТ" { n = $2; bad = 0; next }
            n != "" && /Access failed/ { bad = 1; next }
            n != "" && /^ftp:\/\// {
              if (!bad && index($0, dom)) { print n; exit }
              n = ""
            }
          ')
          if [ -z "$MATCH" ]; then
            echo "::error::Корень сайта не найден ни по одному из кандидатов. Смотрите дерево выше."
            exit 1
          fi
          case "$MATCH" in
            1) DIR="/www/$DOMAIN"; SHOWN="$DIR" ;;
            2) DIR="/data/www/$DOMAIN"; SHOWN="$DIR" ;;
            3) DIR="/var/www/$FTP_USER/data/www/$DOMAIN"; SHOWN="/var/www/<пользователь>/data/www/$DOMAIN" ;;
            4) DIR="www/$DOMAIN"; SHOWN="$DIR" ;;
            5) DIR="$DOMAIN"; SHOWN="$DIR" ;;
            6) DIR="/$DOMAIN"; SHOWN="$DIR" ;;
          esac
          # Страховка на случай, если список кандидатов однажды перепишут:
          # заливать с --delete можно только туда, где стоит имя домена.
          case "$DIR" in
            *"$DOMAIN"*) : ;;
            *) echo "::error::Путь кандидата $MATCH не содержит имени домена — заливать в него нельзя."; exit 1 ;;
          esac
          echo "Совпал кандидат $MATCH: $SHOWN"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Выкладка
        # ПОТОЛОК ПО ВРЕМЕНИ ОБЯЗАТЕЛЕН. Первая заливка прошла за минуту,
        # вторая встала намертво на пятнадцать: хостинг ограничивает число
        # одновременных FTP-сессий, и lftp ждал освободившийся слот молча.
        # Лучше упасть за десять минут с внятной ошибкой, чем висеть.
        timeout-minutes: 10
        # --delete вычищает то, чего в выдаче больше нет: иначе на сервере
        # копятся старые чанки _next и снятые страницы.
        # .well-known не трогаем ни при каких условиях — по нему Let's Encrypt
        # подтверждает домен, и стереть его значит потерять сертификат.
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
        run: |
          set -euo pipefail
          lftp -c "
            set cmd:fail-exit yes;
            open \"$FTP_HOST\";
            mirror -R --delete --verbose=1 \
              --exclude-glob .well-known* \
              --exclude-glob cgi-bin* \
              out/ \"${{ steps.root.outputs.dir }}\";
          "

      - name: Убрать учётные данные
        if: always()
        run: rm -f "$HOME/.netrc" "$HOME/.lftprc"

      - name: Проверка боем
        # Выкладка без проверки — это надежда, а не выкладка. Смотрим на живой
        # адрес: отдаются ли страницы, работает ли своя 404, дошли ли до
        # сервера правила .htaccess (сжатие и заголовки кеша) и есть ли
        # настоящий сертификат.
        run: |
          set -uo pipefail
          FAIL=0
          # Сертификат проверяем отдельно от доступности: самоподписанная
          # заглушка хостинга отвечает на 443, но браузеру не годится.
          if curl -sS -m 20 -o /dev/null "https://$DOMAIN/" 2>/dev/null; then
            SCHEME=https
            echo "Сертификат настоящий: https отвечает без ругани."
          else
            SCHEME=http
            echo "::warning::Сертификата нет — на 443 самоподписанная заглушка. Проверяем по http, принудительный https не включаем."
          fi
          BASE="$SCHEME://$DOMAIN"

          echo "--- коды ответа"
          for ADDR in "/" "/catalog/" "/catalog/?category=pesok" "/fonts/" "/logo/" "/logo/card/1/" "/robots.txt"; do
            CODE=$(curl -sS -m 20 -o /dev/null -w '%{http_code}' -L "$BASE$ADDR")
            printf '  %-28s %s\n' "$ADDR" "$CODE"
            [ "$CODE" = 200 ] || FAIL=1
          done
          CODE=$(curl -sS -m 20 -o /dev/null -w '%{http_code}' "$BASE/такой-страницы-нет/")
          printf '  %-28s %s\n' "несуществующий адрес" "$CODE"
          [ "$CODE" = 404 ] || FAIL=1

          echo "--- своя ли страница 404"
          # Метка next-error-h1 есть только у страницы, которую собрал Next.
          # Апачевская «Not Found» её не содержит — по ней и отличаем.
          if curl -sS -m 20 "$BASE/такой-страницы-нет/" | grep -q "next-error-h1"; then
            echo "  да, своя — отдаётся 404.html из выдачи"
          else
            echo "::warning::404 отдаётся серверная — ErrorDocument не сработал."
            FAIL=1
          fi

          echo "--- адрес без завершающего слэша"
          curl -sS -m 20 -o /dev/null -w '  /catalog → %{http_code} %{redirect_url}\n' "$BASE/catalog"

          echo "--- сжатие"
          for ADDR in "/" "$(grep -o '/_next/static/css/[A-Za-z0-9]*\.css' out/index.html | head -1)"; do
            ENC=$(curl -sS -m 20 -H 'Accept-Encoding: gzip, br' -o /dev/null -D - "$BASE$ADDR" \
                  | tr -d '\r' | awk 'tolower($1)=="content-encoding:"{print $2}')
            printf '  %-42s %s\n' "$ADDR" "${ENC:-нет}"
          done

          echo "--- заголовки кеша"
          ASSET=$(grep -o '/_next/static/css/[A-Za-z0-9]*\.css' out/index.html | head -1)
          IMG=$(ls out/img | head -1)
          for ADDR in "/" "$ASSET" "/img/$IMG" "/robots.txt"; do
            CC=$(curl -sS -m 20 -o /dev/null -D - "$BASE$ADDR" \
                 | tr -d '\r' | awk 'tolower($1)=="cache-control:"{$1="";print substr($0,2)}')
            printf '  %-42s %s\n' "$ADDR" "${CC:-нет}"
          done

          echo "--- www и схема"
          curl -sS -m 20 -o /dev/null -w '  www → %{http_code} %{redirect_url}\n' "$SCHEME://www.$DOMAIN/"
          curl -sS -m 20 -o /dev/null -w '  http → %{http_code} %{redirect_url}\n' "http://$DOMAIN/"

          echo "--- сервер"
          curl -sS -m 20 -o /dev/null -D - "$BASE/" | tr -d '\r' | grep -i '^server:' | sed 's/^/  /'

          exit $FAIL

      - name: Lighthouse по боевому адресу
        # Только по кнопке: пять прогонов на страницу занимают минуты, и на
        # каждый пуш это лишнее. Берётся медиана — одиночный прогон на общем
        # раннере ничего не значит.
        if: inputs.lighthouse
        run: |
          npm i -g lighthouse@12
          for PAGE in "" "catalog/"; do
            TAG=$([ -z "$PAGE" ] && echo лендинг || echo каталог)
            for I in 1 2 3 4 5; do
              lighthouse "https://$DOMAIN/$PAGE" --form-factor=mobile --screenEmulation.mobile \
                --only-categories=performance,accessibility,best-practices,seo \
                --output=json --output-path="/tmp/$TAG-$I.json" \
                --chrome-flags="--headless --no-sandbox" --quiet || true
            done
            TAG="$TAG" node -e '
              const fs = require("fs"), tag = process.env.TAG;
              const rows = [1, 2, 3, 4, 5].map((i) => {
                try {
                  const d = JSON.parse(fs.readFileSync(`/tmp/${tag}-${i}.json`));
                  return [Math.round(d.categories.performance.score * 100),
                    d.audits["largest-contentful-paint"].numericValue / 1000,
                    d.audits["total-blocking-time"].numericValue,
                    Math.round(d.categories.accessibility.score * 100),
                    Math.round(d.categories["best-practices"].score * 100),
                    Math.round(d.categories.seo.score * 100)];
                } catch (e) { return null; }
              }).filter(Boolean);
              const med = (a) => a.slice().sort((x, y) => x - y)[Math.floor(a.length / 2)];
              const col = (i) => rows.map((r) => r[i]);
              console.log(tag, JSON.stringify(col(0)),
                "медиана", med(col(0)),
                "| LCP", med(col(1)).toFixed(2),
                "| TBT", Math.round(med(col(2))),
                "| дост", med(col(3)), "практ", med(col(4)), "SEO", med(col(5)));
            '
          done
