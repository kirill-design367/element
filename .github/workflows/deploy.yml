name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Параллельные выкладки не нужны: в очереди держим последнюю.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Проверка типов
        run: npx tsc --noEmit

      - name: Сборка статики
        # basePath задаётся здесь: локально сайт живёт в корне, на Pages —
        # в /element. Значение читают и next.config.mjs, и хелпер asset().
        env:
          NEXT_PUBLIC_BASE_PATH: /element
        run: npm run build

      - name: Отключить обработку Jekyll
        # Без этого Pages выкидывает всё, что начинается с подчёркивания,
        # то есть весь каталог _next.
        run: touch out/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
