name: Выкладка на elementst.ru

# Сайт переехал с GitHub Pages на хостинг рег.ру. Публикация на Pages убрана
# вместе с прежним содержимым этого файла: два адреса у одного сайта путают
# и людей, и поиск.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      lighthouse:
        description: Прогнать Lighthouse по боевому адресу
        type: boolean
        default: false

# Токен нужен только на чтение исходников: заливка идёт по FTP своими
# секретами, ничего в репозиторий workflow не пишет.
permissions:
  contents: read

# Параллельные выкладки на один хостинг недопустимы: две встречные заливки с
# удалением лишнего съедят друг друга. В очереди держим последнюю.
concurrency:
  group: deploy
  cancel-in-progress: true

env:
  DOMAIN: elementst.ru

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Данные из админки
        # ЭТОТ ШАГ ТЕРПИТ ВСЁ. Нет сети, лежит хостинг, не было ни одной
        # публикации, не подошёл ключ — сборка идёт на данных из
        # репозитория, и сайт выходит прежним, а не пустым. Падать надо не
        # когда данных нет, а когда они пришли битыми: это следующий шаг.
        env:
          CMS_EXPORT_URL: https://elementst.ru/api/cms-export.php
          CMS_EXPORT_KEY: ${{ secrets.CMS_EXPORT_KEY }}
        run: node scripts/cms-fetch.mjs cms-data.json

      - name: Проверка и подстановка данных
        # А ЭТОТ ШАГ ПАДАЕТ, И В ЭТОМ ЕГО СМЫСЛ. Данные пришли — значит они
        # обязаны сойтись с типами. Не сошлись: сборка останавливается, на
        # сайте остаётся прежняя версия. Каталог с пустыми ценами или без
        # половины позиций хуже, чем вчерашний.
        run: |
          if [ -f cms-data.json ]; then
            node scripts/cms-apply.mjs cms-data.json
          else
            echo "CMS: снимка нет — данные берутся из репозитория."
            echo "CMS: это штатный путь, а не сбой: сайт соберётся на последней"
            echo "CMS: опубликованной версии, которая лежит в lib/data/."
          fi

      - name: Проверка типов
        # Стоит ПОСЛЕ подстановки: проверять надо те данные, с которыми
        # пойдёт сборка, а не те, что лежали в репозитории.
        run: npx tsc --noEmit

      - name: Сборка статики
        # Без NEXT_PUBLIC_BASE_PATH — сборка идёт под корень домена.
        run: npm run build

      - name: Проверка, что в выдаче нет подпапки
        run: node scripts/no-basepath.mjs

      - name: Проверка, что заявка не уходит через почтовый клиент
        # Заявка отправляется на /api/lead.php. Открытие почтовой программы
        # посетителя — прежний механизм, и вернуться ему нельзя: у половины
        # людей почтовик не настроен, и заявка на этом терялась.
        run: node scripts/no-mail-client.mjs

      - name: Установка lftp
        # lftp вместо готового экшена: mirror -R --delete делает ровно то, что
        # нужно (залить выдачу и вычистить то, чего в ней больше нет), и не
        # тащит в выкладку стороннего кода с доступом к секретам.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Учётные данные FTP
        # Пароль уходит в ~/.netrc, а не в командную строку: аргументы видны в
        # списке процессов, а спецсимволы в пароле ломают разбор -u user,pass.
        # Файл живёт только внутри задания и удаляется последним шагом.
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          umask 077
          printf 'machine %s\nlogin %s\npassword %s\n' \
            "$FTP_HOST" "$FTP_USER" "$FTP_PASSWORD" > "$HOME/.netrc"
          chmod 600 "$HOME/.netrc"
          # Настройки соединения — один раз на все вызовы lftp, а не копией в
          # каждом: разойдутся, и один из вызовов пойдёт открытым текстом.
          #
          # ssl-force ДА, verify-certificate НЕТ — и это осознанный размен, а
          # не небрежность. Сертификат FTPS на этом хостинге самоподписанный
          # («The certificate issuer is unknown»), проверить цепочку не по
          # чему. Отключать шифрование ради этого нельзя: пароль ушёл бы по
          # сети открытым текстом. ssl-force запрещает молчаливый откат в
          # открытый FTP, protect-data шифрует и канал данных. Остаётся, что
          # соединение зашифровано, но подлинность сервера не подтверждена.
          printf '%s\n' \
            'set ftp:ssl-force true' \
            'set ftp:ssl-protect-data true' \
            'set ssl:verify-certificate no' \
            'set net:max-retries 2' \
            'set net:timeout 15' \
            'set net:reconnect-interval-base 5' \
            'set net:reconnect-interval-max 15' \
            'set ftp:passive-mode true' \
            'set mirror:parallel-transfer-count 2' > "$HOME/.lftprc"
          chmod 600 "$HOME/.lftprc"

      - name: Разведка — где корень сайта
        # Путь не угадываем: ISPmanager кладёт домены по-разному, и промах с
        # последующим --delete стоил бы чужих файлов.
        #
        # ВСЁ ДЕЛАЕТСЯ ОДНОЙ СЕССИЕЙ, и это не красота, а необходимость.
        # Прежняя версия открывала отдельное соединение на каждого кандидата
        # и на каждый листинг — десяток подключений подряд, — и хостинг начал
        # их душить: шаг вставал намертво на пятнадцать минут. Теперь одно
        # соединение, внутри него все cd и ls.
        timeout-minutes: 5
        id: root
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
        run: |
          set -uo pipefail
          # cmd:fail-exit no — неудачный cd не обрывает сессию, а печатает
          # ошибку; по строкам «КАНДИДАТ N» и следующему за ними pwd видно,
          # какой путь существует.
          # ПЕРВЫМ ИДЁТ ТОТ, ЧТО ОКАЗАЛСЯ ВЕРНЫМ. Учётка FTP заперта в
          # каталоге data аккаунта, поэтому серверный абсолютный путь
          # /var/www/<пользователь>/data/www/<домен> по FTP недостижим — тот
          # же каталог виден как /www/<домен>. Остальные кандидаты оставлены
          # запасными: у другого хостинга дерево будет другим.
          SCRIPT="set cmd:fail-exit no; open \"$FTP_HOST\"; echo ТОЧКА-ВХОДА; pwd; cls -l;"
          N=0
          for DIR in \
            "/www/$DOMAIN" \
            "/data/www/$DOMAIN" \
            "/var/www/$FTP_USER/data/www/$DOMAIN" \
            "www/$DOMAIN" \
            "$DOMAIN" \
            "/$DOMAIN"
          do
            N=$((N + 1))
            SCRIPT="$SCRIPT cd /; echo КАНДИДАТ $N; cd \"$DIR\"; pwd;"
          done
          OUT=$(lftp -c "$SCRIPT" 2>&1)
          echo "$OUT" | sed 's/^/  /'

          # ПРОВАЛИВШИЙСЯ cd ТОЖЕ ПЕЧАТАЕТ строку ftp://, только с прежним
          # каталогом — значит отличать успех от неудачи по наличию строки
          # нельзя. Отличаем по тому, стоит ли в пути имя домена: хост и
          # пользователь в логе замаскированы звёздочками, а путь виден.
          MATCH=$(echo "$OUT" | awk -v dom="$DOMAIN" '
            $1 == "КАНДИДАТ" { n = $2; bad = 0; next }
            n != "" && /Access failed/ { bad = 1; next }
            n != "" && /^ftp:\/\// {
              if (!bad && index($0, dom)) { print n; exit }
              n = ""
            }
          ')
          if [ -z "$MATCH" ]; then
            echo "::error::Корень сайта не найден ни по одному из кандидатов. Смотрите дерево выше."
            exit 1
          fi
          case "$MATCH" in
            1) DIR="/www/$DOMAIN"; SHOWN="$DIR" ;;
            2) DIR="/data/www/$DOMAIN"; SHOWN="$DIR" ;;
            3) DIR="/var/www/$FTP_USER/data/www/$DOMAIN"; SHOWN="/var/www/<пользователь>/data/www/$DOMAIN" ;;
            4) DIR="www/$DOMAIN"; SHOWN="$DIR" ;;
            5) DIR="$DOMAIN"; SHOWN="$DIR" ;;
            6) DIR="/$DOMAIN"; SHOWN="$DIR" ;;
          esac
          # Страховка на случай, если список кандидатов однажды перепишут:
          # заливать с --delete можно только туда, где стоит имя домена.
          case "$DIR" in
            *"$DOMAIN"*) : ;;
            *) echo "::error::Путь кандидата $MATCH не содержит имени домена — заливать в него нельзя."; exit 1 ;;
          esac
          echo "Совпал кандидат $MATCH: $SHOWN"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Выкладка
        # ПОТОЛОК ПО ВРЕМЕНИ ОБЯЗАТЕЛЕН. Первая заливка прошла за минуту,
        # вторая встала намертво на пятнадцать: хостинг ограничивает число
        # одновременных FTP-сессий, и lftp ждал освободившийся слот молча.
        # Лучше упасть за десять минут с внятной ошибкой, чем висеть.
        timeout-minutes: 10
        # --delete вычищает то, чего в выдаче больше нет: иначе на сервере
        # копятся старые чанки _next и снятые страницы.
        # .well-known не трогаем ни при каких условиях — по нему Let's Encrypt
        # подтверждает домен, и стереть его значит потерять сертификат.
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
        run: |
          set -euo pipefail
          lftp -c "
            set cmd:fail-exit yes;
            open \"$FTP_HOST\";
            mirror -R --delete --verbose=1 \
              --exclude-glob .well-known* \
              --exclude-glob cgi-bin* \
              out/ \"${{ steps.root.outputs.dir }}\";
          "

      - name: Убрать учётные данные
        if: always()
        run: rm -f "$HOME/.netrc" "$HOME/.lftprc"

      - name: Проверка боем
        # Выкладка без проверки — это надежда, а не выкладка. Смотрим на живой
        # адрес: сертификат, редиректы, коды ответа, своя ли 404, дошли ли до
        # сервера правила .htaccess (сжатие и заголовки кеша).
        run: |
          set -uo pipefail
          FAIL=0

          echo "--- сертификат"
          if curl -sS -m 20 -o /dev/null "https://$DOMAIN/" 2>/dev/null; then
            echo "  сертификат валидный, https отвечает"
          else
            echo "::error::https не отвечает или сертификат не проходит проверку."
            curl -sS -m 20 -o /dev/null "https://$DOMAIN/" 2>&1 | sed 's/^/  /' || true
            FAIL=1
          fi
          # Полнота цепочки: сервер обязан отдавать промежуточный сертификат.
          # Без него часть клиентов (старые Android, часть библиотек) сайт не
          # откроет, хотя браузер на десктопе достроит цепочку сам.
          echo | openssl s_client -connect "$DOMAIN:443" -servername "$DOMAIN" -showcerts 2>/dev/null \
            | awk '/^ [0-9] s:/ || /^ *[0-9] s:/ {print "  " $0} /^ *[0-9] i:/ {print "  " $0}' \
            | head -20 || true
          DEPTH=$(echo | openssl s_client -connect "$DOMAIN:443" -servername "$DOMAIN" -showcerts 2>/dev/null \
            | grep -c 'BEGIN CERTIFICATE' || true)
          echo "  сертификатов в цепочке: $DEPTH"
          [ "$DEPTH" -ge 2 ] || { echo "::error::Промежуточного сертификата нет — цепочка неполная."; FAIL=1; }
          echo | openssl s_client -connect "$DOMAIN:443" -servername "$DOMAIN" 2>/dev/null \
            | openssl x509 -noout -subject -issuer -dates 2>/dev/null | sed 's/^/  /' || true

          echo "--- редиректы (каждый шаг отдельно, чтобы поймать двойные)"
          # -w %{redirect_url} без -L: показывает ОДИН шаг. Двойной редирект
          # виден по тому, что следующий адрес тоже отвечает 301.
          for START in "http://$DOMAIN/" "http://www.$DOMAIN/" "https://www.$DOMAIN/"; do
            ADDR="$START"; HOPS=0
            while [ "$HOPS" -lt 5 ]; do
              LINE=$(curl -sS -m 20 -o /dev/null -w '%{http_code} %{redirect_url}' "$ADDR")
              CODE=${LINE%% *}; NEXT=${LINE#* }
              echo "  $ADDR → $CODE ${NEXT:-—}"
              case "$CODE" in 30*) ;; *) break ;; esac
              HOPS=$((HOPS + 1)); ADDR="$NEXT"
            done
            echo "  итого шагов: $HOPS"
            [ "$HOPS" -le 1 ] || { echo "::error::Цепочка из $HOPS редиректов от $START — должен быть один."; FAIL=1; }
            case "$ADDR" in https://$DOMAIN*) ;; *) echo "::error::$START приводит на $ADDR, а не на https без www."; FAIL=1 ;; esac
          done

          BASE="https://$DOMAIN"
          echo "--- коды ответа"
          # Служебных страниц /fonts/ и /logo/ в списке больше нет: удалены
          # 30.08 вместе с маршрутами. Зато появился приёмник заявки — он не
          # страница, а PHP-скрипт, и проверяется отдельно ниже.
          for ADDR in "/" "/catalog/" "/catalog/?category=pesok&fraction=0-5" "/#raschet" \
                      "/robots.txt"; do
            CODE=$(curl -sS -m 20 -o /dev/null -w '%{http_code}' -L "$BASE$ADDR")
            printf '  %-42s %s\n' "$ADDR" "$CODE"
            [ "$CODE" = 200 ] || FAIL=1
          done
          # Прямая ссылка с фильтром должна отдаваться БЕЗ редиректа: иначе
          # параметры или якорь могли бы потеряться по дороге.
          for ADDR in "/catalog/?category=pesok&fraction=0-5" "/#raschet"; do
            LINE=$(curl -sS -m 20 -o /dev/null -w '%{http_code} %{redirect_url}' "$BASE$ADDR")
            echo "  без -L: $ADDR → $LINE"
          done
          CODE=$(curl -sS -m 20 -o /dev/null -w '%{http_code}' "$BASE/такой-страницы-нет/")
          printf '  %-42s %s\n' "несуществующий адрес" "$CODE"
          [ "$CODE" = 404 ] || FAIL=1

          echo "--- своя ли страница 404"
          if curl -sS -m 20 "$BASE/такой-страницы-нет/" | grep -q "next-error-h1"; then
            echo "  да, своя — отдаётся 404.html из выдачи"
          else
            echo "::error::404 отдаётся серверная — ErrorDocument не сработал."
            FAIL=1
          fi

          echo "--- приёмник заявки"
          # Скрипт обязан ОТВЕЧАТЬ и обязан быть исполнен, а не отдан текстом.
          # Второе важнее: если PHP на пути не включён, Apache отдаст исходник
          # файла — и заявки будут молча теряться при внешне рабочей форме.
          LEAD=$(curl -sS -m 20 -o /tmp/lead-get.txt -w '%{http_code}' "$BASE/api/lead.php")
          echo "  GET /api/lead.php → $LEAD"
          if grep -q '<?php' /tmp/lead-get.txt; then
            echo "::error::PHP не исполняется — сервер отдал исходник скрипта."
            FAIL=1
          fi
          # На GET скрипт отвечает 405: принимает он только POST.
          [ "$LEAD" = 405 ] || { echo "::error::Приёмник заявки ответил $LEAD вместо 405."; FAIL=1; }
          # Пустой POST обязан быть отвергнут сервером, а не только браузером.
          EMPTY=$(curl -sS -m 20 -o /tmp/lead-empty.txt -w '%{http_code}' -X POST "$BASE/api/lead.php")
          echo "  POST без полей → $EMPTY $(head -c 120 /tmp/lead-empty.txt)"
          [ "$EMPTY" = 422 ] || { echo "::error::Пустая заявка принята сервером ($EMPTY)."; FAIL=1; }

          echo "--- админка и данные CMS"
          # Админка открывается, но в поиск не отдаётся.
          ADM=$(curl -sS -m 20 -o /tmp/adm.txt -D /tmp/adm.h -w '%{http_code}' "$BASE/admin/login.php")
          echo "  GET /admin/login.php → $ADM"
          [ "$ADM" = 200 ] || { echo "::error::Админка не отвечает ($ADM)."; FAIL=1; }
          if grep -q '<?php' /tmp/adm.txt; then
            echo "::error::PHP не исполняется — сервер отдал исходник админки."; FAIL=1
          fi
          if tr -d '\r' < /tmp/adm.h | grep -qi '^x-robots-tag:.*noindex'; then
            echo "  заголовок noindex на месте"
          else
            echo "::error::Админка отдаётся без X-Robots-Tag: noindex."; FAIL=1
          fi
          # В robots.txt админки быть НЕ должно: файл открыт всем, и строка
          # Disallow опубликовала бы ровно тот адрес, который прячется.
          if curl -sS -m 20 "$BASE/robots.txt" | grep -qi 'admin'; then
            echo "::error::В robots.txt упомянута админка — это публикует её адрес."; FAIL=1
          else
            echo "  в robots.txt админки нет — так и надо"
          fi

          # ДОСТУПЫ НЕ ОТДАЮТСЯ ПО ПРЯМОМУ АДРЕСУ. Файл настроек лежит вне
          # корня сайта; образец и SQL закрыты .htaccess. Проверяется фактом,
          # а не предположением.
          for SECRET in "/cms-config.php" "/admin/cms-config.php" "/admin/cms-config.sample.php" \
                        "/admin/sql/schema.php" "/admin/sql/seed.php" "/admin/lib/config.php"; do
            CODE=$(curl -sS -m 20 -o /tmp/secret.txt -w '%{http_code}' "$BASE$SECRET")
            printf '  %-34s %s\n' "$SECRET" "$CODE"
            case "$CODE" in
              403|404) ;;
              *) echo "::error::$SECRET отдаётся кодом $CODE — доступы могут утечь."; FAIL=1 ;;
            esac
            if grep -qi 'github_token\|db_pass\|password_hash' /tmp/secret.txt 2>/dev/null; then
              echo "::error::В ответе на $SECRET видны доступы."; FAIL=1
            fi
          done

          # Выгрузка данных закрыта ключом.
          EXP=$(curl -sS -m 20 -o /dev/null -w '%{http_code}' "$BASE/api/cms-export.php")
          echo "  GET /api/cms-export.php без ключа → $EXP"
          [ "$EXP" = 403 ] || { echo "::error::Выгрузка данных отвечает $EXP без ключа — должна 403."; FAIL=1; }

          echo "--- смешанное содержимое в разметке"
          # Ни одной ссылки на http:// в собственных адресах страницы. Ищем в
          # том, что реально отдал сервер, а не в исходниках.
          for PAGE in "/" "/catalog/"; do
            # ОБЯЗАТЕЛЬНОЕ || true. GitHub запускает шаг как bash -e, а grep,
            # ничего не нашедший, возвращает единицу — то есть шаг падал ровно
            # тогда, когда смешанного содержимого НЕТ. Отсутствие находки
            # оформлялось как провал.
            MIXED=$(curl -sS -m 20 "$BASE$PAGE" \
              | grep -o '\(src\|href\)="http://[^"]*"' \
              | grep -v 'schema.org\|www.w3.org' | head -5 || true)
            if [ -n "$MIXED" ]; then
              echo "::error::На $PAGE есть ссылки по http:"; echo "$MIXED" | sed 's/^/    /'; FAIL=1
            else
              echo "  $PAGE — ссылок по http нет"
            fi
          done

          echo "--- сжатие"
          ASSET=$(grep -o '/_next/static/css/[A-Za-z0-9]*\.css' out/index.html | head -1 || true)
          for ADDR in "/" "$ASSET"; do
            ENC=$(curl -sS -m 20 -H 'Accept-Encoding: gzip, br' -o /dev/null -D - "$BASE$ADDR" \
                  | tr -d '\r' | awk 'tolower($1)=="content-encoding:"{print $2}')
            printf '  %-42s %s\n' "$ADDR" "${ENC:-нет}"
          done

          echo "--- заголовки кеша"
          IMG=$(ls out/img | head -1)
          for ADDR in "/" "$ASSET" "/img/$IMG" "/robots.txt"; do
            CC=$(curl -sS -m 20 -o /dev/null -D - "$BASE$ADDR" \
                 | tr -d '\r' | awk 'tolower($1)=="cache-control:"{$1="";print substr($0,2)}')
            printf '  %-42s %s\n' "$ADDR" "${CC:-нет}"
          done

          echo "--- сервер"
          curl -sS -m 20 -o /dev/null -D - "$BASE/" | tr -d '\r' | grep -i '^server:' | sed 's/^/  /' || true

          exit $FAIL

      - name: Проверка живьём в браузере
        # Часть требований проверяется только браузером: пришёл ли шрифт,
        # ведёт ли перелёт из ленты в каталог, приземляются ли якоря,
        # пересчитывается ли калькулятор, чиста ли консоль. Ставится по
        # кнопке вместе с Lighthouse — на каждый пуш поднимать браузер
        # незачем.
        if: inputs.lighthouse
        run: |
          npx --yes playwright@1 install --with-deps chromium
          BASE="https://$DOMAIN" node scripts/root-check.mjs

      - name: Lighthouse по боевому адресу
        # Только по кнопке: пять прогонов на страницу занимают минуты, и на
        # каждый пуш это лишнее. Берётся медиана — одиночный прогон на общем
        # раннере ничего не значит.
        if: inputs.lighthouse
        run: |
          npm i -g lighthouse@12
          for PAGE in "" "catalog/"; do
            TAG=$([ -z "$PAGE" ] && echo лендинг || echo каталог)
            for I in 1 2 3 4 5; do
              lighthouse "https://$DOMAIN/$PAGE" --form-factor=mobile --screenEmulation.mobile \
                --only-categories=performance,accessibility,best-practices,seo \
                --output=json --output-path="/tmp/$TAG-$I.json" \
                --chrome-flags="--headless --no-sandbox" --quiet || true
            done
            TAG="$TAG" node -e '
              const fs = require("fs"), tag = process.env.TAG;
              const rows = [1, 2, 3, 4, 5].map((i) => {
                try {
                  const d = JSON.parse(fs.readFileSync(`/tmp/${tag}-${i}.json`));
                  return [Math.round(d.categories.performance.score * 100),
                    d.audits["largest-contentful-paint"].numericValue / 1000,
                    d.audits["total-blocking-time"].numericValue,
                    Math.round(d.categories.accessibility.score * 100),
                    Math.round(d.categories["best-practices"].score * 100),
                    Math.round(d.categories.seo.score * 100)];
                } catch (e) { return null; }
              }).filter(Boolean);
              const med = (a) => a.slice().sort((x, y) => x - y)[Math.floor(a.length / 2)];
              const col = (i) => rows.map((r) => r[i]);
              console.log(tag, JSON.stringify(col(0)),
                "медиана", med(col(0)),
                "| LCP", med(col(1)).toFixed(2),
                "| TBT", Math.round(med(col(2))),
                "| дост", med(col(3)), "практ", med(col(4)), "SEO", med(col(5)));
            '
          done
